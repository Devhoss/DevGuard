plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.devhoss.devguard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.devhoss.devguard'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        resourceConfigurations += ['en']
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
        resValues false
    }

    // Name the release artifact after the app and version, e.g. DevGuard-1.0.0.apk.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "DevGuard-${variant.versionName}.apk"
        }
    }
}

// No third-party dependencies by design: Android framework APIs only.
// This keeps the app small, offline and free of analytics or network libraries.
